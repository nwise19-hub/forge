/* ---------- resolve a barcode to a food ---------- */
function cachedBarcode(code) {
  return S.customFoods.filter(function (f) { return f.barcode === code; })[0];
}
function lookupBarcode(code) {
  var cached = cachedBarcode(code);
  if (cached) { fState.meal = fState.meal || 'Snacks'; portionSheet(cached); return; }

  var done = false;
  sheet({
    title: 'Looking up ' + code,
    body: '<div class="spin"></div><div class="center sm mut2" id="bcMsg">Checking the food database…</div>'
  });
  var to = setTimeout(function () { if (!done) { done = true; barcodeMiss(code, 'timeout'); } }, 11000);

  fetch('https://world.openfoodfacts.org/api/v2/product/' + encodeURIComponent(code) +
    '.json?fields=code,product_name,brands,nutriments,serving_size,serving_quantity,quantity')
    .then(function (r) { return r.json(); })
    .then(function (j) {
      if (done) return; done = true; clearTimeout(to);
      if (!j || j.status !== 1 || !j.product) { barcodeMiss(code, 'notfound'); return; }
      var p = j.product, n = p.nutriments || {};
      var kcal = n['energy-kcal_100g'];
      if (kcal == null && n['energy_100g'] != null) kcal = n['energy_100g'] / 4.184;
      if (kcal == null || !p.product_name) { barcodeMiss(code, 'nodata'); return; }
      var f = {
        id: 'bc-' + code, barcode: code, custom: true, scanned: true,
        name: String(p.product_name).slice(0, 70),
        brand: (p.brands || '').split(',')[0].trim(),
        cat: 'Scanned', unit: 'g',
        kcal: r1(kcal), p: r1(n['proteins_100g'] || 0), c: r1(n['carbohydrates_100g'] || 0),
        f: r1(n['fat_100g'] || 0), fib: r1(n['fiber_100g'] || 0),
        servings: []
      };
      var sq = parseFloat(p.serving_quantity);
      if (sq > 0 && sq < 2000) f.servings.push({ label: '1 serving' + (p.serving_size ? ' (' + p.serving_size + ')' : ''), g: Math.round(sq) });
      f.servings.push({ label: '100 g', g: 100 });
      var pq = parseFloat(p.quantity);
      if (pq > 0 && pq < 5000 && Math.abs(pq - 100) > 1) f.servings.push({ label: 'whole package', g: Math.round(pq) });

      S.customFoods = S.customFoods.filter(function (x) { return x.id !== f.id; });
      S.customFoods.unshift(f);

      closeSheet();
      setTimeout(function () { if (!fState.meal || inRecipeMode()) fState.meal = guessMeal(); portionSheet(f); }, 220);

/* ============================ FORGE — safety net ============================ */
/* Automatic restore points. Before a new build of the app is allowed to touch
   anything, the previous state is copied aside. Losing history to an update
   should be structurally impossible, not merely unlikely. */

var BUILD = window.FORGE_BUILD || 'dev';
var SNAPKEY = 'forge.snaps.v1';
var MAX_SNAPS = 4;

function loadSnaps() {
  try { return JSON.parse((_canStore ? localStorage.getItem(SNAPKEY) : null) || '[]'); }
  catch (e) { return []; }
}
function writeSnaps(list) {
  if (!_canStore) return false;
  for (var i = 0; i < 3; i++) {
    try { localStorage.setItem(SNAPKEY, JSON.stringify(list)); return true; }
    catch (e) { if (!list.length) return false; list.shift(); }   /* full: drop oldest, retry */
  }
  return false;
}
function hasRealData() {
  return S.workouts.length > 0 || Object.keys(S.foodLog).length > 0 || S.weights.length > 1;
}
function snapCounts() {
  return { workouts: S.workouts.length, foodDays: Object.keys(S.foodLog).length,
           weights: S.weights.length, plans: S.plans.length };
}
function takeSnapshot(reason) {
  if (!_canStore || !hasRealData()) return false;
  var list = loadSnaps(), payload = JSON.stringify(snapshot(S));
  var last = list[list.length - 1];
  if (last && last.data === payload) return true;           /* nothing has changed */
  list.push({ at: Date.now(), build: BUILD, reason: reason || 'update',
              counts: snapCounts(), data: payload });
  while (list.length > MAX_SNAPS) list.shift();
  return writeSnaps(list);
}
function restoreSnapshot(i) {
  var list = loadSnaps(), s = list[i];
  if (!s) return false;
  var obj;
  try { obj = JSON.parse(s.data); } catch (e) { return false; }
  if (!obj || typeof obj !== 'object') return false;
  takeSnapshot('before restore');                            /* the undo for the undo */
  applySnapshot(obj);
  saveNow();
  return true;
}

/* Runs at boot, before the UI renders or sync can push anything. */
function versionGuard() {
  if (S.appBuild === BUILD) return;
  if (S.appBuild) takeSnapshot('updated to ' + BUILD);       /* skip on first install */
  S.appBuild = BUILD;

if (!window.FORGE_NO_SW && 'serviceWorker' in navigator && window.isSecureContext && location.protocol !== 'file:') {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('./sw.js').catch(function () { });
  });
}

/* ---------- start ---------- */
versionGuard();          /* snapshot before a new build touches anything */
mountTabs();
render();
if (isFresh()) setTimeout(onboarding, 320);
else if (S.sync.token && S.sync.auto) setTimeout(function () { syncNow({ quiet: true }); }, 900);

</script>

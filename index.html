<link rel="manifest" href="./manifest.webmanifest">
<style>
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0A0C10; --bg2:#10141B; --card:#161C25; --card2:#1D242F; --line:#252E3A; --line2:#33404F;
  --tx:#F2F5F9; --tx2:#94A3B4; --tx3:#66748A;
  --acc:#FF6B35; --acc2:#FF8C5A; --accd:#7A2E12;
  --pro:#38BDF8; --carb:#FBBF24; --fat:#F472B6; --ok:#34D399; --bad:#F87171; --info:#A78BFA;
  --r:16px; --r2:12px; --r3:10px;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --ff:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
html,body{margin:0;padding:0;height:100%;overscroll-behavior-y:none}
body{
  background:var(--bg); color:var(--tx); font-family:var(--ff);
  font-size:16px; line-height:1.45; -webkit-font-smoothing:antialiased;
  -webkit-text-size-adjust:100%; touch-action:manipulation;
}
button,input,select,textarea{font-family:inherit;font-size:16px;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer;color:inherit}
input,select,textarea{background:var(--card2);border:1px solid var(--line);border-radius:var(--r3);padding:11px 12px;color:var(--tx);width:100%;outline:none;appearance:none;-webkit-appearance:none}
input:focus,select,textarea:focus{border-color:var(--line2)}
input:focus{border-color:var(--acc)}
input[type=number]{-moz-appearance:textfield}
input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
select{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8'><path d='M1 1l5 5 5-5' stroke='%2394A3B4' stroke-width='1.8' fill='none' stroke-linecap='round'/></svg>");background-repeat:no-repeat;background-position:right 12px center;padding-right:34px}
a{color:var(--acc);text-decoration:none}
::-webkit-scrollbar{width:0;height:0}

/* ---------- layout ---------- */
#app{padding-top:calc(var(--sat) + 8px);padding-bottom:calc(72px + var(--sab));min-height:100%}
.wrap{padding:0 16px;max-width:640px;margin:0 auto}
.hdr{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:6px 0 14px}
.hdr h1{font-size:28px;font-weight:800;letter-spacing:-.5px;margin:0}
.hdr .sub{color:var(--tx2);font-size:13px;margin-top:2px}
h2.sec{font-size:13px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--tx3);margin:22px 0 10px}
h2.sec:first-child{margin-top:6px}
.spacer{height:18px}

/* ---------- tab bar ---------- */
#tabs{
  position:fixed;left:0;right:0;bottom:0;z-index:60;
  display:flex;background:rgba(12,15,20,.86);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-top:1px solid var(--line);padding-bottom:var(--sab);
}
#tabs button{flex:1;padding:9px 2px 7px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--tx3);font-size:10px;font-weight:600;letter-spacing:.02em}
#tabs button svg{width:23px;height:23px;stroke-width:1.9}
#tabs button.on{color:var(--acc)}

/* ---------- cards ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:15px}
.card+.card{margin-top:10px}
.card.tap:active{background:var(--card2)}
.row{display:flex;align-items:center;gap:12px}
.row.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.mut{color:var(--tx2)}
.mut2{color:var(--tx3)}
.sm{font-size:13px}
.xs{font-size:11.5px}
.b{font-weight:700}
.tnum{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.trunc{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.center{text-align:center}
.hide{display:none !important}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;background:var(--card2);border:1px solid var(--line);border-radius:var(--r2);padding:11px 16px;font-weight:650;font-size:15px}
.btn:active{transform:scale(.975)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#160800}
.btn.gho{background:transparent}
.btn.dan{color:var(--bad);border-color:#4A2020;background:#221414}
.btn.blk{display:flex;width:100%}
.btn.sml{padding:7px 12px;font-size:13.5px;border-radius:9px}
.btn[disabled]{opacity:.4;pointer-events:none}
.btn svg{width:17px;height:17px;stroke-width:2.2}
.btnrow{display:flex;gap:8px}
.btnrow>*{flex:1}
.fab{position:fixed;right:16px;bottom:calc(84px + var(--sab));z-index:55;width:56px;height:56px;border-radius:50%;background:var(--acc);color:#160800;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 24px rgba(255,107,53,.35)}
.fab svg{width:26px;height:26px;stroke-width:2.4}
.pill{display:inline-flex;align-items:center;gap:5px;background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:12.5px;font-weight:600;color:var(--tx2);white-space:nowrap}
.pill.on{background:var(--accd);border-color:var(--acc);color:var(--acc2)}
.chips{display:flex;gap:7px;overflow-x:auto;padding:2px 16px 2px;margin:0 -16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.seg{display:flex;background:var(--card2);border:1px solid var(--line);border-radius:11px;padding:3px;gap:3px}
.seg button{flex:1;padding:7px 6px;border-radius:8px;font-size:13.5px;font-weight:650;color:var(--tx2)}
.seg button.on{background:var(--acc);color:#160800}
.tog{width:46px;height:28px;border-radius:999px;background:var(--line);position:relative;flex:none;transition:background .15s}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .15s}
.tog.on{background:var(--acc)}
.tog.on::after{transform:translateX(18px)}

/* ---------- list ---------- */
.list{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.li{display:flex;align-items:center;gap:12px;padding:13px 15px;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li:active{background:var(--card2)}
.li .chev{color:var(--tx3);flex:none}
.li .chev svg{width:16px;height:16px;stroke-width:2.4;display:block}
.ico{width:38px;height:38px;border-radius:11px;background:var(--card2);display:flex;align-items:center;justify-content:center;flex:none;font-size:17px}
.ico svg{width:19px;height:19px;stroke-width:2}
.empty{text-align:center;padding:34px 20px;color:var(--tx3)}
.empty .big{margin-bottom:12px;opacity:.45;line-height:0}
.empty .big svg{width:40px;height:40px;stroke-width:1.5}
.li>svg{width:18px;height:18px;stroke-width:2.2;flex:none;color:var(--tx3)}
.bigico{line-height:0}
.bigico svg{width:46px;height:46px;stroke-width:1.6}

/* ---------- macro / rings ---------- */
.ringwrap{display:flex;align-items:center;gap:18px}
.ring{position:relative;flex:none}
.ring .val{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .val b{font-size:23px;font-weight:800;letter-spacing:-.5px;line-height:1}
.ring .val span{font-size:10px;color:var(--tx3);margin-top:3px;text-transform:uppercase;letter-spacing:.06em}
.macros{display:flex;gap:11px;flex:1}
.macro{flex:1;min-width:0}
.macro .t{display:flex;justify-content:space-between;gap:4px;font-size:11px;margin-bottom:5px;letter-spacing:.02em}
.macro .bar{height:6px;border-radius:3px;background:var(--card2);overflow:hidden}
.macro .bar i{display:block;height:100%;border-radius:3px}
.mp{color:var(--pro)} .mc{color:var(--carb)} .mf{color:var(--fat)}
.bp{background:var(--pro)} .bc{background:var(--carb)} .bf{background:var(--fat)}

/* ---------- sheet / modal ---------- */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:100;opacity:0;transition:opacity .2s;backdrop-filter:blur(2px)}
.scrim.in{opacity:1}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:101;background:var(--bg2);
  border-radius:20px 20px 0 0;border-top:1px solid var(--line2);
  max-height:92vh;display:flex;flex-direction:column;
  transform:translateY(100%);transition:transform .26s cubic-bezier(.32,.72,0,1);
}
.sheet.in{transform:translateY(0)}
.sheet.full{top:0;border-radius:0;max-height:none;padding-top:var(--sat)}
.sheet .grab{width:36px;height:4px;border-radius:2px;background:var(--line2);margin:9px auto 4px;flex:none}
.sheet .shd{display:flex;align-items:center;gap:12px;padding:8px 16px 12px;border-bottom:1px solid var(--line);flex:none}
.sheet .shd h3{margin:0;font-size:17px;font-weight:750;flex:1;letter-spacing:-.2px}
.sheet .sbody{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 16px calc(20px + var(--sab));flex:1}
.sheet .sfoot{padding:12px 16px calc(14px + var(--sab));border-top:1px solid var(--line);flex:none;background:var(--bg2)}
.x{width:30px;height:30px;border-radius:50%;background:var(--card2);display:flex;align-items:center;justify-content:center;color:var(--tx2);flex:none}
.x svg{width:15px;height:15px;stroke-width:2.6}
.fld{margin-bottom:13px}
.fld label{display:block;font-size:12px;font-weight:650;color:var(--tx2);margin-bottom:6px;letter-spacing:.02em}
.fld .hint{font-size:11.5px;color:var(--tx3);margin-top:5px}
.f2{display:flex;gap:10px}
.f2>*{flex:1}
.toast{position:fixed;left:50%;transform:translateX(-50%) translateY(20px);bottom:calc(92px + var(--sab));z-index:200;background:#F2F5F9;color:#0A0C10;padding:11px 18px;border-radius:999px;font-weight:650;font-size:14px;opacity:0;transition:.22s;pointer-events:none;box-shadow:0 8px 24px rgba(0,0,0,.4);max-width:88vw;text-align:center}
.toast.in{opacity:1;transform:translateX(-50%) translateY(0)}

/* ---------- workout session ---------- */
.exblk{background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin-bottom:10px;overflow:hidden}
.exblk .eh{display:flex;align-items:center;gap:10px;padding:13px 14px 11px}
.exblk .eh .nm{font-weight:700;font-size:15.5px;letter-spacing:-.2px}
.exblk .eh .mt{font-size:11.5px;color:var(--tx3);margin-top:2px}
.setrow{display:grid;grid-template-columns:30px 1fr 1fr 44px;gap:8px;align-items:center;padding:6px 14px}
.setrow.hd{padding-bottom:2px;font-size:10.5px;color:var(--tx3);text-transform:uppercase;letter-spacing:.07em;font-weight:700}
.setrow .n{text-align:center;font-weight:750;color:var(--tx2);font-size:14px}
.setrow input{padding:9px 6px;text-align:center;font-weight:700;font-size:16px;background:var(--card2)}
.setrow .prev{font-size:10px;color:var(--tx3);text-align:center;margin-top:3px;font-weight:600}
.setrow .ck{width:40px;height:38px;border-radius:10px;background:var(--card2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--tx3)}
.setrow .ck svg{width:18px;height:18px;stroke-width:3}
.setrow.done input{background:rgba(52,211,153,.09);border-color:rgba(52,211,153,.28)}
.setrow.done .ck{background:var(--ok);border-color:var(--ok);color:#04231A}
.setrow.warm .n{color:var(--carb)}
.exfoot{display:flex;gap:8px;padding:8px 14px 13px}
.timerbar{position:fixed;left:0;right:0;bottom:calc(0px + var(--sab));z-index:70;background:var(--acc);color:#160800;display:flex;align-items:center;gap:9px;padding:11px 14px;font-weight:750}
.timerbar svg{width:20px;height:20px;stroke-width:2.3;flex:none}
.timerbar .t{font-size:21px;font-variant-numeric:tabular-nums;letter-spacing:-.5px;flex:none}
.timerbar .lbl{font-size:13px;opacity:.72;flex:none}
.timerbar .prg{position:absolute;left:0;bottom:0;height:3px;background:rgba(0,0,0,.28)}
.sesshd{position:sticky;top:0;z-index:5;background:linear-gradient(var(--bg2) 72%,transparent);padding:4px 0 10px}

/* ---------- charts ---------- */
.chart{width:100%;display:block;overflow:visible}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .lb{fill:var(--tx3);font-size:9.5px;font-weight:600}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--tx2);margin-top:10px}
.legend i{width:9px;height:9px;border-radius:3px;display:inline-block;margin-right:5px;vertical-align:-1px}

/* ---------- habits ---------- */
.habits{display:flex;gap:8px;overflow-x:auto;margin:0 -16px;padding:2px 16px;scrollbar-width:none}
.habits::-webkit-scrollbar{display:none}
.hab{flex:none;width:78px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 6px;text-align:center}
.hab .e{font-size:22px;line-height:1}
.hab .n{font-size:10.5px;color:var(--tx2);margin-top:6px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hab .s{font-size:9.5px;color:var(--tx3);margin-top:2px;font-weight:700}
.hab.on{background:rgba(52,211,153,.12);border-color:rgba(52,211,153,.4)}
.hab.on .n{color:var(--ok)}
.dots{display:flex;gap:4px;justify-content:center;margin-top:7px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--line2)}
.dots i.f{background:var(--ok)}

/* ---------- misc ---------- */
.datenav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:14px}
.datenav button{width:36px;height:36px;border-radius:10px;background:var(--card);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--tx2);flex:none}
.datenav button svg{width:16px;height:16px;stroke-width:2.4}
.datenav .d{text-align:center;font-weight:700;font-size:15px}
.datenav .d span{display:block;font-size:11px;color:var(--tx3);font-weight:600;margin-top:1px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px}
.stat .k{font-size:11px;color:var(--tx3);text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.stat .v{font-size:21px;font-weight:800;letter-spacing:-.6px;margin-top:4px}
.stat .d{font-size:11.5px;margin-top:2px;font-weight:600}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px}
.up{color:var(--ok)} .dn{color:var(--bad)}
.tag{font-size:10px;font-weight:750;padding:2.5px 7px;border-radius:6px;background:var(--card2);color:var(--tx2);letter-spacing:.03em}
.tag.pr{background:rgba(255,107,53,.16);color:var(--acc2)}
.tag.new{background:rgba(56,189,248,.14);color:var(--pro)}
.srch{position:relative}
.srch svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:17px;height:17px;color:var(--tx3);stroke-width:2.2}
.srch input{padding-left:37px}
.kv{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.kv:last-child{border-bottom:0}
.kv .k{color:var(--tx2)}
.kv .v{font-weight:700}
.spin{width:20px;height:20px;border:2.5px solid var(--line2);border-top-color:var(--acc);border-radius:50%;animation:sp .7s linear infinite;margin:22px auto}
@keyframes sp{to{transform:rotate(360deg)}}
.fadein{animation:fi .22s ease}
@keyframes fi{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}

</style>
</head>

{ id:"dumbbell-curl", name:"Dumbbell Curl", muscle:"Biceps", secondary:["Forearms"], equipment:"Dumbbell", type:"weight", cue:"Supinate fully so your pinky turns up at the top of every single rep." },
{ id:"seated-dumbbell-curl", name:"Seated Dumbbell Curl", muscle:"Biceps", secondary:["Forearms"], equipment:"Dumbbell", type:"weight", cue:"Sitting removes body english, so use a weight you can lift without rocking your torso." },
{ id:"alternating-dumbbell-curl", name:"Alternating Dumbbell Curl", muscle:"Biceps", secondary:["Forearms"], equipment:"Dumbbell", type:"weight", cue:"Finish one arm completely before starting the other instead of letting the reps overlap." },
{ id:"incline-dumbbell-curl", name:"Incline Dumbbell Curl", muscle:"Biceps", secondary:["Forearms"], equipment:"Dumbbell", type:"weight", cue:"Let your arms hang behind your torso to load the stretch, and resist shrugging forward." },
{ id:"hammer-curl", name:"Hammer Curl", muscle:"Biceps", secondary:["Forearms"], equipment:"Dumbbell", type:"weight", cue:"Keep your palms facing each other the whole way; rotating turns this into a regular curl." },
{ id:"cross-body-hammer-curl", name:"Cross-Body Hammer Curl", muscle:"Biceps", secondary:["Forearms"], equipment:"Dumbbell", type:"weight", cue:"Curl toward the opposite shoulder while keeping your upper arm still against your side." },
{ id:"concentration-curl", name:"Concentration Curl", muscle:"Biceps", secondary:[], equipment:"Dumbbell", type:"weight", cue:"Brace your elbow against your inner thigh and curl without pushing your leg outward." },
{ id:"spider-curl", name:"Spider Curl", muscle:"Biceps", secondary:["Forearms"], equipment:"Dumbbell", type:"weight", cue:"Hang your arms straight down from the incline bench and never let them drift backward." },
{ id:"cable-curl", name:"Cable Curl", muscle:"Biceps", secondary:["Forearms"], equipment:"Cable", type:"weight", cue:"Step back slightly from the pulley so tension stays constant even at the bottom." },
{ id:"rope-hammer-curl", name:"Rope Hammer Curl", muscle:"Biceps", secondary:["Forearms"], equipment:"Cable", type:"weight", cue:"Spread the rope ends apart at the top to add a hard peak contraction." },
{ id:"bayesian-cable-curl", name:"Bayesian Cable Curl", muscle:"Biceps", secondary:["Forearms"], equipment:"Cable", type:"weight", cue:"Face away from the stack with your arm behind you to load the deep stretch." },
{ id:"drag-curl", name:"Drag Curl", muscle:"Biceps", secondary:["Forearms"], equipment:"Barbell", type:"weight", cue:"Drag the bar up your torso by pulling your elbows back rather than lifting them forward." },
{ id:"zottman-curl", name:"Zottman Curl", muscle:"Biceps", secondary:["Forearms"], equipment:"Dumbbell", type:"weight", cue:"Rotate to a palms-down grip at the top and lower slowly to hit your forearms." },
{ id:"band-curl", name:"Band Curl", muscle:"Biceps", secondary:["Forearms"], equipment:"Bands", type:"weight", cue:"Resist the band on the way down instead of letting it snap your arms straight." },
{ id:"barbell-21s", name:"Barbell 21s", muscle:"Biceps", secondary:["Forearms"], equipment:"Barbell", type:"weight", cue:"Use a much lighter bar than normal; the final seven full reps should feel brutal." },
{ id:"machine-curl", name:"Machine Curl", muscle:"Biceps", secondary:["Forearms"], equipment:"Machine", type:"weight", cue:"Keep your chest against the pad and avoid pushing down with your wrists to help." },
// --- Triceps ---
{ id:"close-grip-bench-press", name:"Close-Grip Bench Press", muscle:"Triceps", secondary:["Chest","Shoulders"], equipment:"Barbell", type:"weight", cue:"Grip about shoulder width, not narrower, and keep your elbows tucked close to your ribs." },
{ id:"jm-press", name:"JM Press", muscle:"Triceps", secondary:["Chest"], equipment:"Barbell", type:"weight", cue:"Lower the bar toward your chin with elbows forward, splitting the difference between press and extension." },
{ id:"ez-bar-skull-crusher", name:"EZ Bar Skull Crusher", muscle:"Triceps", secondary:[], equipment:"EZ Bar", type:"weight", cue:"Aim the bar behind your head rather than at your forehead to keep tension on the triceps." },
{ id:"dumbbell-skull-crusher", name:"Dumbbell Skull Crusher", muscle:"Triceps", secondary:[], equipment:"Dumbbell", type:"weight", cue:"Keep your upper arms angled slightly back and completely still through every rep." },
{ id:"tate-press", name:"Tate Press", muscle:"Triceps", secondary:["Chest"], equipment:"Dumbbell", type:"weight", cue:"Flare your elbows out and lower the dumbbells toward your chest with palms facing forward." },
{ id:"barbell-overhead-triceps-extension", name:"Barbell Overhead Triceps Extension", muscle:"Triceps", secondary:["Core"], equipment:"Barbell", type:"weight", cue:"Keep your ribs pulled down so the stretch happens in your triceps, not your lower back." },
{ id:"dumbbell-overhead-triceps-extension", name:"Dumbbell Overhead Triceps Extension", muscle:"Triceps", secondary:["Core"], equipment:"Dumbbell", type:"weight", cue:"Hold your elbows close to your head and let the weight drop deep behind your neck." },
{ id:"single-arm-overhead-triceps-extension", name:"Single-Arm Overhead Triceps Extension", muscle:"Triceps", secondary:[], equipment:"Dumbbell", type:"weight", cue:"Support the working elbow with your free hand to stop it flaring out sideways." },
{ id:"cable-overhead-triceps-extension", name:"Cable Overhead Triceps Extension", muscle:"Triceps", secondary:["Core"], equipment:"Cable", type:"weight", cue:"Step far enough forward that the cable pulls your arms into a full overhead stretch." },
{ id:"rope-triceps-pushdown", name:"Rope Triceps Pushdown", muscle:"Triceps", secondary:[], equipment:"Cable", type:"weight", cue:"Spread the rope apart at the bottom and lock your elbows against your sides." },
{ id:"straight-bar-triceps-pushdown", name:"Straight-Bar Triceps Pushdown", muscle:"Triceps", secondary:[], equipment:"Cable", type:"weight", cue:"Stand close to the stack and stop leaning your bodyweight down onto the bar." },
{ id:"v-bar-triceps-pushdown", name:"V-Bar Triceps Pushdown", muscle:"Triceps", secondary:[], equipment:"Cable", type:"weight", cue:"Let the bar rise until your forearms touch your biceps for full range each rep." },
{ id:"reverse-grip-triceps-pushdown", name:"Reverse-Grip Triceps Pushdown", muscle:"Triceps", secondary:[], equipment:"Cable", type:"weight", cue:"Use an underhand grip and lighter weight to target the often-neglected long head." },
{ id:"single-arm-triceps-pushdown", name:"Single-Arm Triceps Pushdown", muscle:"Triceps", secondary:[], equipment:"Cable", type:"weight", cue:"Keep your shoulder down and locked so only your forearm moves through the rep." },
{ id:"banded-triceps-pushdown", name:"Banded Triceps Pushdown", muscle:"Triceps", secondary:[], equipment:"Bands", type:"weight", cue:"Anchor the band high and squeeze hard at lockout where the tension peaks." },
{ id:"dumbbell-triceps-kickback", name:"Dumbbell Triceps Kickback", muscle:"Triceps", secondary:[], equipment:"Dumbbell", type:"weight", cue:"Fix your upper arm parallel to the floor and straighten only at the elbow." },
{ id:"cable-triceps-kickback", name:"Cable Triceps Kickback", muscle:"Triceps", secondary:[], equipment:"Cable", type:"weight", cue:"Hinge forward and hold lockout for a beat; the cable keeps tension the dumbbell loses." },
{ id:"bench-dip", name:"Bench Dip", muscle:"Triceps", secondary:["Chest","Shoulders"], equipment:"Bodyweight", type:"weighted-bodyweight", cue:"Keep your back close to the bench and stop before your shoulders drop below your elbows." },
{ id:"parallel-bar-dip", name:"Parallel Bar Dip", muscle:"Triceps", secondary:["Chest","Shoulders"], equipment:"Bodyweight", type:"weighted-bodyweight", cue:"Stay upright with elbows tucked to bias triceps, and lower only to a comfortable depth." },
{ id:"assisted-dip", name:"Assisted Dip", muscle:"Triceps", secondary:["Chest","Shoulders"], equipment:"Machine", type:"weight", cue:"Reduce the assistance weekly rather than staying on the same setting for months." },
{ id:"machine-triceps-extension", name:"Machine Triceps Extension", muscle:"Triceps", secondary:[], equipment:"Machine", type:"weight", cue:"Set the seat so your elbows sit directly on the pad's pivot point before starting." },
{ id:"diamond-push-up", name:"Diamond Push-Up", muscle:"Triceps", secondary:["Chest","Core"], equipment:"Bodyweight", type:"bodyweight", cue:"Place hands under your sternum and keep elbows brushing your ribs as you lower." },
// --- Forearms ---
{ id:"barbell-wrist-curl", name:"Barbell Wrist Curl", muscle:"Forearms", secondary:[], equipment:"Barbell", type:"weight", cue:"Let the bar roll to your fingertips at the bottom, then curl it back up fully." },
{ id:"dumbbell-wrist-curl", name:"Dumbbell Wrist Curl", muscle:"Forearms", secondary:[], equipment:"Dumbbell", type:"weight", cue:"Rest your forearm on your thigh and move only at the wrist through a full range." },
{ id:"behind-the-back-barbell-wrist-curl", name:"Behind-the-Back Barbell Wrist Curl", muscle:"Forearms", secondary:[], equipment:"Barbell", type:"weight", cue:"Hold the bar behind your glutes and curl your wrists up without bending your elbows." },
{ id:"barbell-reverse-wrist-curl", name:"Barbell Reverse Wrist Curl", muscle:"Forearms", secondary:[], equipment:"Barbell", type:"weight", cue:"Use far lighter weight than the palms-up version; extensors fatigue much faster than flexors." },
{ id:"dumbbell-reverse-wrist-curl", name:"Dumbbell Reverse Wrist Curl", muscle:"Forearms", secondary:[], equipment:"Dumbbell", type:"weight", cue:"Anchor your forearm firmly and lift the back of your hand toward the ceiling." },
{ id:"ez-bar-reverse-curl", name:"EZ Bar Reverse Curl", muscle:"Forearms", secondary:["Biceps"], equipment:"EZ Bar", type:"weight", cue:"Keep your wrists straight and locked; letting them bend removes load from your forearms." },
{ id:"cable-reverse-curl", name:"Cable Reverse Curl", muscle:"Forearms", secondary:["Biceps"], equipment:"Cable", type:"weight", cue:"Curl with an overhand grip and stop the moment your wrists start to break backward." },
{ id:"wrist-roller", name:"Wrist Roller", muscle:"Forearms", secondary:["Shoulders"], equipment:"Other", type:"weight", cue:"Hold your arms out straight and roll the weight up and down without dropping your elbows." },
{ id:"plate-pinch-hold", name:"Plate Pinch Hold", muscle:"Forearms", secondary:[], equipment:"Other", type:"time", cue:"Pinch two smooth plates together and hold until your grip genuinely fails, not before." },
{ id:"dead-hang", name:"Dead Hang", muscle:"Forearms", secondary:["Back","Core"], equipment:"Bodyweight", type:"time", cue:"Hang with active shoulders rather than fully slumped, and breathe steadily through the hold." },
{ id:"hand-gripper", name:"Hand Gripper", muscle:"Forearms", secondary:[], equipment:"Other", type:"weight", cue:"Close the gripper fully every rep; partial closes build far less usable grip strength." },
{ id:"cable-wrist-curl", name:"Cable Wrist Curl", muscle:"Forearms", secondary:[], equipment:"Cable", type:"weight", cue:"Kneel facing the low pulley and let the constant tension work the bottom stretch." },
// --- Quads ---
{ id:"barbell-back-squat", name:"Barbell Back Squat", muscle:"Quads", secondary:["Glutes","Hamstrings","Core"], equipment:"Barbell", type:"weight", cue:"Sit down between your hips rather than folding forward, keeping your knees tracking over your toes." },
{ id:"low-bar-back-squat", name:"Low-Bar Back Squat", muscle:"Quads", secondary:["Glutes","Hamstrings","Back"], equipment:"Barbell", type:"weight", cue:"Expect more forward lean than a high-bar squat, but your hips and chest must rise together." },
{ id:"front-squat", name:"Front Squat", muscle:"Quads", secondary:["Glutes","Core"], equipment:"Barbell", type:"weight", cue:"Keep your elbows high; the moment they drop, the bar rolls forward and you lose the lift." },
{ id:"box-squat", name:"Box Squat", muscle:"Quads", secondary:["Glutes","Hamstrings"], equipment:"Barbell", type:"weight", cue:"Sit back onto the box under control and pause without rocking or relaxing your torso." },
{ id:"pause-squat", name:"Pause Squat", muscle:"Quads", secondary:["Glutes","Core"], equipment:"Barbell", type:"weight", cue:"Hold two full seconds in the hole while staying tight, then drive up without bouncing." },
{ id:"safety-bar-squat", name:"Safety Bar Squat", muscle:"Quads", secondary:["Glutes","Back"], equipment:"Barbell", type:"weight", cue:"The bar will push you forward, so actively pull your chest up through the whole rep." },
{ id:"zercher-squat", name:"Zercher Squat", muscle:"Quads", secondary:["Core","Glutes"], equipment:"Barbell", type:"weight", cue:"Cradle the bar in your elbow crease and keep your torso upright as you sit down." },
{ id:"overhead-squat", name:"Overhead Squat", muscle:"Quads", secondary:["Shoulders","Core"], equipment:"Barbell", type:"weight", cue:"Push the bar up and back over your mid-foot and keep your armpits facing forward." },
{ id:"smith-machine-squat", name:"Smith Machine Squat", muscle:"Quads", secondary:["Glutes","Hamstrings"], equipment:"Smith Machine", type:"weight", cue:"Set your feet slightly forward so your knees stay behind your toes on the fixed path." },
{ id:"landmine-squat", name:"Landmine Squat", muscle:"Quads", secondary:["Glutes","Core"], equipment:"Other", type:"weight", cue:"Let the bar counterbalance you so you can stay upright and squat deeper than usual." },
{ id:"belt-squat", name:"Belt Squat", muscle:"Quads", secondary:["Glutes"], equipment:"Machine", type:"weight", cue:"Load your legs without spinal compression, but still brace so your hips do not shoot back." },
{ id:"hack-squat-machine", name:"Hack Squat Machine", muscle:"Quads", secondary:["Glutes"], equipment:"Machine", type:"weight", cue:"Place your feet low on the platform to bias quads, and never let your heels lift." },
{ id:"leg-press", name:"Leg Press", muscle:"Quads", secondary:["Glutes","Hamstrings"], equipment:"Machine", type:"weight", cue:"Stop lowering the moment your lower back starts to round off the seat pad." },
{ id:"single-leg-press", name:"Single-Leg Press", muscle:"Quads", secondary:["Glutes"], equipment:"Machine", type:"weight", cue:"Center your foot on the platform and keep your knee from caving inward under load." },
{ id:"leg-extension", name:"Leg Extension", muscle:"Quads", secondary:[], equipment:"Machine", type:"weight", cue:"Align the pad just above your ankles and pause at lockout instead of swinging the weight." },
{ id:"single-leg-extension", name:"Single-Leg Extension", muscle:"Quads", secondary:[], equipment:"Machine", type:"weight", cue:"Work the weaker leg first and match the stronger leg to its rep count." },
{ id:"goblet-squat", name:"Goblet Squat", muscle:"Quads", secondary:["Glutes","Core"], equipment:"Kettlebell", type:"weight", cue:"Hold the bell tight to your chest and use your elbows to push your knees out." },
{ id:"dumbbell-squat", name:"Dumbbell Squat", muscle:"Quads", secondary:["Glutes"], equipment:"Dumbbell", type:"weight", cue:"Keep the dumbbells hanging straight down at your sides and your chest lifted throughout." },
{ id:"heels-elevated-goblet-squat", name:"Heels-Elevated Goblet Squat", muscle:"Quads", secondary:["Glutes"], equipment:"Dumbbell", type:"weight", cue:"Elevating your heels lets you stay upright and drive your knees forward over your toes." },
{ id:"dumbbell-split-squat", name:"Dumbbell Split Squat", muscle:"Quads", secondary:["Glutes","Hamstrings"], equipment:"Dumbbell", type:"weight", cue:"Drop your back knee straight down and keep most of your weight on the front heel." },
{ id:"bulgarian-split-squat", name:"Bulgarian Split Squat", muscle:"Quads", secondary:["Glutes","Hamstrings"], equipment:"Dumbbell", type:"weight", cue:"Set your front foot far enough forward that your shin stays roughly vertical at the bottom." },
{ id:"barbell-lunge", name:"Barbell Lunge", muscle:"Quads", secondary:["Glutes","Hamstrings"], equipment:"Barbell", type:"weight", cue:"Take a long enough step that your front knee stays over your ankle, not past it." },
{ id:"walking-lunge", name:"Walking Lunge", muscle:"Quads", secondary:["Glutes","Hamstrings"], equipment:"Dumbbell", type:"weight", cue:"Step through with control and avoid letting your back knee slam into the floor." },
{ id:"reverse-lunge", name:"Reverse Lunge", muscle:"Quads", secondary:["Glutes","Hamstrings"], equipment:"Dumbbell", type:"weight", cue:"Stepping backward keeps the knee quieter, so stay tall and push through the front heel." },
{ id:"lateral-lunge", name:"Lateral Lunge", muscle:"Quads", secondary:["Glutes","Hamstrings"], equipment:"Dumbbell", type:"weight", cue:"Push your hips back as you step sideways and keep the trailing leg completely straight." },
{ id:"dumbbell-step-up", name:"Dumbbell Step-Up", muscle:"Quads", secondary:["Glutes","Hamstrings"], equipment:"Dumbbell", type:"weight", cue:"Drive entirely through the top foot without pushing off the floor with your trailing leg." },
{ id:"sissy-squat", name:"Sissy Squat", muscle:"Quads", secondary:[], equipment:"Bodyweight", type:"bodyweight", cue:"Lean back as your knees travel forward and keep your hips fully extended the whole time." },
{ id:"pistol-squat", name:"Pistol Squat", muscle:"Quads", secondary:["Glutes","Core"], equipment:"Bodyweight", type:"weighted-bodyweight", cue:"Hold a light counterweight out in front of you to stay balanced as you descend." },
{ id:"air-squat", name:"Air Squat", muscle:"Quads", secondary:["Glutes","Core"], equipment:"Bodyweight", type:"bodyweight", cue:"Keep your heels planted and reach hip crease below knee level on every rep." },
{ id:"jump-squat", name:"Jump Squat", muscle:"Quads", secondary:["Glutes","Calves"], equipment:"Bodyweight", type:"bodyweight", cue:"Land quietly on the mid-foot and absorb into the next squat rather than stiff-legging the impact." },
{ id:"box-jump", name:"Box Jump", muscle:"Quads", secondary:["Glutes","Calves"], equipment:"Bodyweight", type:"bodyweight", cue:"Step down between reps instead of jumping down to protect your knees and Achilles." },
{ id:"wall-sit", name:"Wall Sit", muscle:"Quads", secondary:["Glutes","Core"], equipment:"Bodyweight", type:"time", cue:"Set your thighs parallel to the floor and resist sliding your hips up as you fatigue." },
{ id:"banded-squat", name:"Banded Squat", muscle:"Quads", secondary:["Glutes","Core"], equipment:"Bands", type:"weight", cue:"Push your knees out against the band the entire descent, not only at the bottom." },
{ id:"front-rack-kettlebell-squat", name:"Front-Rack Kettlebell Squat", muscle:"Quads", secondary:["Glutes","Core"], equipment:"Kettlebell", type:"weight", cue:"Keep both bells tight in the rack with elbows down so your ribs stay stacked." },
// --- Hamstrings ---
{ id:"romanian-deadlift", name:"Romanian Deadlift", muscle:"Hamstrings", secondary:["Glutes","Back"], equipment:"Barbell", type:"weight", cue:"Push your hips back and keep the bar dragging your thighs; this is a hinge, not a squat." },
{ id:"dumbbell-romanian-deadlift", name:"Dumbbell Romanian Deadlift", muscle:"Hamstrings", secondary:["Glutes","Back"], equipment:"Dumbbell", type:"weight", cue:"Stop lowering when your hamstrings stop stretching, not when the weights reach the floor." },
{ id:"single-leg-romanian-deadlift", name:"Single-Leg Romanian Deadlift", muscle:"Hamstrings", secondary:["Glutes","Core"], equipment:"Dumbbell", type:"weight", cue:"Keep your hips square to the floor and drive the free leg straight back as a counterweight." },
{ id:"stiff-leg-deadlift", name:"Stiff-Leg Deadlift", muscle:"Hamstrings", secondary:["Glutes","Back"], equipment:"Barbell", type:"weight", cue:"Keep only a slight knee bend and never let your spine round to reach lower." },
{ id:"barbell-good-morning", name:"Barbell Good Morning", muscle:"Hamstrings", secondary:["Glutes","Back"], equipment:"Barbell", type:"weight", cue:"Start far lighter than you expect and hinge until your torso is nearly parallel to the floor." },
{ id:"seated-leg-curl", name:"Seated Leg Curl", muscle:"Hamstrings", secondary:["Calves"], equipment:"Machine", type:"weight", cue:"Set the thigh pad tight and curl fully; the stretched position here builds the most muscle." },
{ id:"lying-leg-curl", name:"Lying Leg Curl", muscle:"Hamstrings", secondary:["Calves"], equipment:"Machine", type:"weight", cue:"Keep your hips pressed into the pad instead of letting them rise as you curl." },
{ id:"standing-leg-curl", name:"Standing Leg Curl", muscle:"Hamstrings", secondary:["Calves"], equipment:"Machine", type:"weight", cue:"Work one leg at a time and stop your hips from swinging to help the curl." },
{ id:"nordic-hamstring-curl", name:"Nordic Hamstring Curl", muscle:"Hamstrings", secondary:["Glutes","Core"], equipment:"Bodyweight", type:"bodyweight", cue:"Lower as slowly as you can with hips fully extended, catching yourself with your hands." },
{ id:"glute-ham-raise", name:"Glute-Ham Raise", muscle:"Hamstrings", secondary:["Glutes","Back"], equipment:"Machine", type:"weighted-bodyweight", cue:"Keep your body in one straight line and avoid breaking at the hips to make it easier." },
{ id:"kettlebell-romanian-deadlift", name:"Kettlebell Romanian Deadlift", muscle:"Hamstrings", secondary:["Glutes","Back"], equipment:"Kettlebell", type:"weight", cue:"Keep the bell close to your legs; letting it drift forward pulls your back into the lift." },
{ id:"swiss-ball-leg-curl", name:"Swiss Ball Leg Curl", muscle:"Hamstrings", secondary:["Glutes","Core"], equipment:"Other", type:"bodyweight", cue:"Hold your hips high the entire set instead of letting them sag as you pull in." },
{ id:"banded-leg-curl", name:"Banded Leg Curl", muscle:"Hamstrings", secondary:["Calves"], equipment:"Bands", type:"weight", cue:"Anchor the band low and fight the pull on the way back down every rep." },
{ id:"smith-machine-romanian-deadlift", name:"Smith Machine Romanian Deadlift", muscle:"Hamstrings", secondary:["Glutes","Back"], equipment:"Smith Machine", type:"weight", cue:"Stand close enough to the bar that the fixed path stays right against your thighs." },
// --- Glutes ---
{ id:"barbell-hip-thrust", name:"Barbell Hip Thrust", muscle:"Glutes", secondary:["Hamstrings","Core"], equipment:"Barbell", type:"weight", cue:"Tuck your chin, keep your ribs down, and finish with a hard glute squeeze at lockout." },
{ id:"dumbbell-hip-thrust", name:"Dumbbell Hip Thrust", muscle:"Glutes", secondary:["Hamstrings"], equipment:"Dumbbell", type:"weight", cue:"Set your feet so your shins are vertical at the top of every single rep." },
{ id:"single-leg-hip-thrust", name:"Single-Leg Hip Thrust", muscle:"Glutes", secondary:["Hamstrings","Core"], equipment:"Bodyweight", type:"weighted-bodyweight", cue:"Keep both hips level at lockout rather than letting the free side drop or rotate." },
{ id:"machine-hip-thrust", name:"Machine Hip Thrust", muscle:"Glutes", secondary:["Hamstrings"], equipment:"Machine", type:"weight", cue:"Pause a full second at the top; rushing turns this into a hip-swinging exercise." },
{ id:"glute-bridge", name:"Glute Bridge", muscle:"Glutes", secondary:["Hamstrings","Core"], equipment:"Bodyweight", type:"bodyweight", cue:"Push through your heels and stop rising once your hips line up with your knees." },
{ id:"barbell-glute-bridge", name:"Barbell Glute Bridge", muscle:"Glutes", secondary:["Hamstrings"], equipment:"Barbell", type:"weight", cue:"Use a pad on the bar and drive your heels down rather than arching your lower back." },
{ id:"single-leg-glute-bridge", name:"Single-Leg Glute Bridge", muscle:"Glutes", secondary:["Hamstrings","Core"], equipment:"Bodyweight", type:"bodyweight", cue:"Hug the non-working knee to your chest so your lower back cannot take over." },
{ id:"cable-pull-through", name:"Cable Pull-Through", muscle:"Glutes", secondary:["Hamstrings","Back"], equipment:"Cable", type:"weight", cue:"Hinge back until you feel the hamstring stretch, then snap your hips forward to stand tall." },
{ id:"cable-glute-kickback", name:"Cable Glute Kickback", muscle:"Glutes", secondary:["Hamstrings"], equipment:"Cable", type:"weight", cue:"Keep your torso still and extend from the hip; arching your back is not extra range." },
{ id:"machine-glute-kickback", name:"Machine Glute Kickback", muscle:"Glutes", secondary:["Hamstrings"], equipment:"Machine", type:"weight", cue:"Press your hips into the pad and squeeze at full extension before returning slowly." },
{ id:"reverse-hyperextension", name:"Reverse Hyperextension", muscle:"Glutes", secondary:["Hamstrings","Back"], equipment:"Machine", type:"weight", cue:"Let your legs swing down under control and stop at hip level, never higher." },
{ id:"frog-pump", name:"Frog Pump", muscle:"Glutes", secondary:["Hamstrings"], equipment:"Dumbbell", type:"weight", cue:"Press the soles of your feet together and flare your knees wide before bridging up." },
{ id:"curtsy-lunge", name:"Curtsy Lunge", muscle:"Glutes", secondary:["Quads","Hamstrings"], equipment:"Dumbbell", type:"weight", cue:"Step diagonally behind and across, keeping your front foot flat and hips facing forward." },
{ id:"dumbbell-sumo-squat", name:"Dumbbell Sumo Squat", muscle:"Glutes", secondary:["Quads","Hamstrings"], equipment:"Dumbbell", type:"weight", cue:"Point your toes out and push your knees toward them as you sink straight down." },
{ id:"hip-abduction-machine", name:"Hip Abduction Machine", muscle:"Glutes", secondary:[], equipment:"Machine", type:"weight", cue:"Lean your torso slightly forward to bias the upper glutes and control the return." },
{ id:"hip-adduction-machine", name:"Hip Adduction Machine", muscle:"Glutes", secondary:["Quads"], equipment:"Machine", type:"weight", cue:"Start from a modest stretch and never force the pads wider than feels comfortable." },
{ id:"banded-lateral-walk", name:"Banded Lateral Walk", muscle:"Glutes", secondary:["Quads"], equipment:"Bands", type:"weight", cue:"Stay in a half squat and keep band tension by never letting your feet touch." },
// --- Calves ---
{ id:"standing-calf-raise", name:"Standing Calf Raise", muscle:"Calves", secondary:[], equipment:"Machine", type:"weight", cue:"Pause at the bottom stretch and the top squeeze instead of bouncing through the reps." },
{ id:"seated-calf-raise", name:"Seated Calf Raise", muscle:"Calves", secondary:[], equipment:"Machine", type:"weight", cue:"Bent knees target the soleus, so use slower tempo and higher reps than standing raises." },
{ id:"leg-press-calf-raise", name:"Leg Press Calf Raise", muscle:"Calves", secondary:[], equipment:"Machine", type:"weight", cue:"Place only the balls of your feet on the platform and keep your knees soft, not locked." },
{ id:"smith-machine-calf-raise", name:"Smith Machine Calf Raise", muscle:"Calves", secondary:[], equipment:"Smith Machine", type:"weight", cue:"Stand on a plate or block so your heels can drop well below your toes." },
{ id:"barbell-standing-calf-raise", name:"Barbell Standing Calf Raise", muscle:"Calves", secondary:[], equipment:"Barbell", type:"weight", cue:"Keep your knees straight and your torso upright so your calves do all the work." },
{ id:"dumbbell-calf-raise", name:"Dumbbell Calf Raise", muscle:"Calves", secondary:[], equipment:"Dumbbell", type:"weight", cue:"Hold something for balance so you can push into full range instead of managing wobble." },
{ id:"single-leg-calf-raise", name:"Single-Leg Calf Raise", muscle:"Calves", secondary:[], equipment:"Bodyweight", type:"weighted-bodyweight", cue:"Rise all the way onto your big toe and lower until you feel a deep stretch." },
{ id:"donkey-calf-raise", name:"Donkey Calf Raise", muscle:"Calves", secondary:[], equipment:"Machine", type:"weight", cue:"Hinging at the hips stretches the calves further, so keep your knees locked straight." },
{ id:"tibialis-raise", name:"Tibialis Raise", muscle:"Calves", secondary:[], equipment:"Bodyweight", type:"bodyweight", cue:"Lean against a wall and pull your toes up slowly to build the front shin." },
// --- Core ---
{ id:"plank", name:"Plank", muscle:"Core", secondary:["Shoulders","Glutes"], equipment:"Bodyweight", type:"time", cue:"Squeeze your glutes and tuck your pelvis so your lower back stays flat, not sagging." },
{ id:"rkc-plank", name:"RKC Plank", muscle:"Core", secondary:["Glutes","Shoulders"], equipment:"Bodyweight", type:"time", cue:"Contract everything at maximum effort; ten hard seconds beats two minutes of casual holding." },
{ id:"long-lever-plank", name:"Long-Lever Plank", muscle:"Core", secondary:["Shoulders","Glutes"], equipment:"Bodyweight", type:"time", cue:"Elbows further forward than a normal plank. Squeeze the glutes, tuck the ribs down, and do not let the hips sag." },
{ id:"side-plank", name:"Side Plank", muscle:"Core", secondary:["Shoulders","Glutes"], equipment:"Bodyweight", type:"time", cue:"Stack your feet, drive your hips high, hold one straight line from ear to ankle. Add seconds before you add anything else; 45 seconds a side is the target." },
{ id:"copenhagen-plank", name:"Copenhagen Plank", muscle:"Core", secondary:["Glutes"], equipment:"Bodyweight", type:"time", cue:"Start with your knee on the bench before progressing to the full straight-leg version." },
{ id:"hollow-body-hold", name:"Hollow Body Hold", muscle:"Core", secondary:["Quads"], equipment:"Bodyweight", type:"time", cue:"Press your lower back into the floor; if it lifts, raise your arms and legs higher." },
{ id:"dead-bug", name:"Dead Bug", muscle:"Core", secondary:[], equipment:"Bodyweight", type:"bodyweight", cue:"Press your lower back flat into the floor and keep it there. The moment it arches as your leg extends, shorten the range — holding that flat back is the entire exercise." },
{ id:"bird-dog", name:"Bird Dog", muscle:"Core", secondary:["Glutes","Back"], equipment:"Bodyweight", type:"bodyweight", cue:"Opposite arm and leg, moving slowly. Keep the hips dead level; a glass of water on your lower back shouldn't spill." },
{ id:"ab-wheel-rollout", name:"Ab Wheel Rollout", muscle:"Core", secondary:["Shoulders","Back"], equipment:"Other", type:"bodyweight", cue:"Start from your knees and roll only as far as you can go without your lower back arching. Extending that range over weeks is the progression — chasing distance early is how people hurt themselves." },
{ id:"body-saw", name:"Body Saw", muscle:"Core", secondary:["Shoulders"], equipment:"Other", type:"bodyweight", cue:"From a forearm plank, rock forward and back on your toes. The spine stays completely still — only your feet move." },
{ id:"pallof-press", name:"Pallof Press", muscle:"Core", secondary:["Shoulders","Glutes"], equipment:"Cable", type:"weight", cue:"Anti-rotation, not a chest press. Stand side-on to the cable, press straight out from your sternum, and do not let your ribs turn." },
{ id:"half-kneeling-pallof-press", name:"Half-Kneeling Pallof Press", muscle:"Core", secondary:["Glutes"], equipment:"Cable", type:"weight", cue:"The cable is trying to twist you. Your only job is refusing to let it. Press out slowly and fight the rotation the whole way." },
{ id:"cable-woodchopper", name:"Cable Woodchopper", muscle:"Core", secondary:["Shoulders","Glutes"], equipment:"Cable", type:"weight", cue:"Rotate through your hips and upper back rather than twisting only at your lower spine." },
{ id:"low-to-high-cable-chop", name:"Low-to-High Cable Chop", muscle:"Core", secondary:["Shoulders","Glutes"], equipment:"Cable", type:"weight", cue:"Pivot your back foot as you rotate up so your knee follows your hip." },
{ id:"landmine-rotation", name:"Landmine Rotation", muscle:"Core", secondary:["Shoulders"], equipment:"Other", type:"weight", cue:"Keep your arms nearly straight and let your hips turn with the bar instead of resisting." },
{ id:"suitcase-carry", name:"Suitcase Carry", muscle:"Core", secondary:["Forearms","Traps"], equipment:"Dumbbell", type:"weight", cue:"One heavy dumbbell, stand tall, and do not lean away from it. Your obliques holding you upright against that load is the whole point." },
{ id:"crunch", name:"Crunch", muscle:"Core", secondary:[], equipment:"Bodyweight", type:"bodyweight", cue:"Curl your ribs toward your hips instead of pulling your head forward with your hands." },
{ id:"cable-crunch", name:"Cable Crunch", muscle:"Core", secondary:[], equipment:"Cable", type:"weight", cue:"Keep your hips fixed and round your spine down; this is not a hip hinge." },
{ id:"machine-crunch", name:"Machine Crunch", muscle:"Core", secondary:[], equipment:"Machine", type:"weight", cue:"Line the pivot with your waist and flex your abs rather than pushing with your arms." },
{ id:"sit-up", name:"Sit-Up", muscle:"Core", secondary:["Quads"], equipment:"Bodyweight", type:"bodyweight", cue:"Come up smoothly without yanking your neck, and lower under control every rep." },
{ id:"decline-sit-up", name:"Decline Sit-Up", muscle:"Core", secondary:["Quads"], equipment:"Bodyweight", type:"bodyweight", cue:"Set a modest decline first; too steep and your hip flexors do most of the work." },
{ id:"weighted-decline-sit-up", name:"Weighted Decline Sit-Up", muscle:"Core", secondary:["Quads"], equipment:"Other", type:"weight", cue:"Hold the plate on your chest, not behind your head, to keep your neck neutral." },
{ id:"v-up", name:"V-Up", muscle:"Core", secondary:["Quads"], equipment:"Bodyweight", type:"bodyweight", cue:"Lift your arms and legs together and touch at the top without bending your knees." },
{ id:"reverse-crunch", name:"Reverse Crunch", muscle:"Core", secondary:[], equipment:"Bodyweight", type:"bodyweight", cue:"Curl your hips off the floor toward your ribs instead of just swinging your legs." },
{ id:"lying-leg-raise", name:"Lying Leg Raise", muscle:"Core", secondary:["Quads"], equipment:"Bodyweight", type:"bodyweight", cue:"Press your lower back flat into the floor and stop before it starts to arch." },
{ id:"hanging-knee-raise", name:"Hanging Knee Raise", muscle:"Core", secondary:["Forearms"], equipment:"Bodyweight", type:"bodyweight", cue:"Stop swinging between reps and lift your knees past your hips using your abs." },
{ id:"hanging-leg-raise", name:"Hanging Leg Raise", muscle:"Core", secondary:["Forearms","Quads"], equipment:"Bodyweight", type:"weighted-bodyweight", cue:"Tilt your pelvis under at the top instead of stopping when your legs hit parallel." },
{ id:"toes-to-bar", name:"Toes-to-Bar", muscle:"Core", secondary:["Back","Forearms"], equipment:"Bodyweight", type:"bodyweight", cue:"Engage your lats to keep control and avoid an uncontrolled swing at the bottom." },
{ id:"captains-chair-leg-raise", name:"Captain's Chair Leg Raise", muscle:"Core", secondary:[], equipment:"Machine", type:"bodyweight", cue:"Press your back into the pad and lift with your abs, not by arching away." },
{ id:"russian-twist", name:"Russian Twist", muscle:"Core", secondary:[], equipment:"Medicine Ball", type:"weight", cue:"Rotate your shoulders and ribcage as a unit rather than waving your arms side to side." },
{ id:"bicycle-crunch", name:"Bicycle Crunch", muscle:"Core", secondary:[], equipment:"Bodyweight", type:"bodyweight", cue:"Slow every rep down and touch elbow to opposite knee with real trunk rotation." },
{ id:"dumbbell-side-bend", name:"Dumbbell Side Bend", muscle:"Core", secondary:["Traps"], equipment:"Dumbbell", type:"weight", cue:"Load only one side at a time and bend straight sideways without leaning forward or back." },
{ id:"mountain-climber", name:"Mountain Climber", muscle:"Core", secondary:["Shoulders","Quads"], equipment:"Bodyweight", type:"bodyweight", cue:"Keep your hips at shoulder height and drive your knees in without bouncing your butt up." },
{ id:"medicine-ball-slam", name:"Medicine Ball Slam", muscle:"Core", secondary:["Shoulders","Back"], equipment:"Medicine Ball", type:"weight", cue:"Reach tall overhead and slam with your whole torso, exhaling hard as the ball lands." },
{ id:"medicine-ball-rotational-throw", name:"Medicine Ball Rotational Throw", muscle:"Core", secondary:["Shoulders","Glutes"], equipment:"Medicine Ball", type:"weight", cue:"Drive the throw from your back hip turning over, not from your arms alone." },
// --- Full Body ---
{ id:"power-clean", name:"Power Clean", muscle:"Full Body", secondary:["Traps","Quads","Glutes"], equipment:"Barbell", type:"weight", cue:"Stay patient off the floor and let the bar reach your hips before you explode upward." },
{ id:"hang-power-clean", name:"Hang Power Clean", muscle:"Full Body", secondary:["Traps","Quads","Glutes"], equipment:"Barbell", type:"weight", cue:"Start from mid-thigh with your shoulders over the bar and jump aggressively into the catch." },
{ id:"squat-clean", name:"Squat Clean", muscle:"Full Body", secondary:["Quads","Traps","Glutes"], equipment:"Barbell", type:"weight", cue:"Pull yourself under fast and catch in a full front squat with elbows already high." },
{ id:"clean-and-jerk", name:"Clean and Jerk", muscle:"Full Body", secondary:["Shoulders","Quads","Traps"], equipment:"Barbell", type:"weight", cue:"Recover fully from the clean and take a breath before you start the jerk dip." },
{ id:"clean-pull", name:"Clean Pull", muscle:"Full Body", secondary:["Traps","Hamstrings","Glutes"], equipment:"Barbell", type:"weight", cue:"Finish with a violent hip extension and full shrug rather than an early elbow bend." },
{ id:"clean-high-pull", name:"Clean High Pull", muscle:"Full Body", secondary:["Traps","Back","Glutes"], equipment:"Barbell", type:"weight", cue:"Keep the bar close and let your elbows rise above your hands at the top." },
{ id:"power-snatch", name:"Power Snatch", muscle:"Full Body", secondary:["Shoulders","Traps","Quads"], equipment:"Barbell", type:"weight", cue:"Keep the bar brushing your hips and punch to lockout the instant you pull under." },
{ id:"hang-power-snatch", name:"Hang Power Snatch", muscle:"Full Body", secondary:["Shoulders","Traps","Quads"], equipment:"Barbell", type:"weight", cue:"Hinge to mid-thigh with a flat back and extend violently before dropping under the bar." },
{ id:"muscle-snatch", name:"Muscle Snatch", muscle:"Full Body", secondary:["Shoulders","Traps","Back"], equipment:"Barbell", type:"weight", cue:"Do not re-bend your knees; the bar must reach lockout on the pull alone." },
{ id:"snatch-high-pull", name:"Snatch High Pull", muscle:"Full Body", secondary:["Traps","Back","Glutes"], equipment:"Barbell", type:"weight", cue:"Extend your hips completely before your arms bend, and keep your elbows pointing outward." },
{ id:"push-jerk", name:"Push Jerk", muscle:"Full Body", secondary:["Shoulders","Triceps","Quads"], equipment:"Barbell", type:"weight", cue:"Dip straight down, drive hard, then re-bend your knees to receive the bar overhead." },
{ id:"split-jerk", name:"Split Jerk", muscle:"Full Body", secondary:["Shoulders","Triceps","Quads"], equipment:"Barbell", type:"weight", cue:"Land with your front shin vertical and back knee soft, with the bar behind your ears." },
{ id:"thruster", name:"Thruster", muscle:"Full Body", secondary:["Quads","Shoulders","Glutes"], equipment:"Barbell", type:"weight", cue:"Blend the squat and press into one motion; pausing at the top wastes your leg drive." },
{ id:"dumbbell-thruster", name:"Dumbbell Thruster", muscle:"Full Body", secondary:["Quads","Shoulders"], equipment:"Dumbbell", type:"weight", cue:"Keep the dumbbells resting on your shoulders through the squat instead of holding them up." },
{ id:"dumbbell-snatch", name:"Dumbbell Snatch", muscle:"Full Body", secondary:["Shoulders","Traps","Glutes"], equipment:"Dumbbell", type:"weight", cue:"Keep the dumbbell close to your body and punch straight up to lockout, not around." },
{ id:"kettlebell-swing", name:"Kettlebell Swing", muscle:"Full Body", secondary:["Glutes","Hamstrings","Core"], equipment:"Kettlebell", type:"weight", cue:"Snap your hips forward to float the bell; this is a hinge, never a front raise." },
{ id:"kettlebell-clean", name:"Kettlebell Clean", muscle:"Full Body", secondary:["Traps","Glutes","Forearms"], equipment:"Kettlebell", type:"weight", cue:"Guide the bell around your hand instead of letting it flip over and bang your wrist." },
{ id:"kettlebell-snatch", name:"Kettlebell Snatch", muscle:"Full Body", secondary:["Shoulders","Glutes","Traps"], equipment:"Kettlebell", type:"weight", cue:"Punch your hand through as the bell rises so it settles softly on your forearm." },
{ id:"kettlebell-clean-and-press", name:"Kettlebell Clean and Press", muscle:"Full Body", secondary:["Shoulders","Glutes","Traps"], equipment:"Kettlebell", type:"weight", cue:"Pause in the rack position and reset your breath before every overhead press." },
{ id:"turkish-get-up", name:"Turkish Get-Up", muscle:"Full Body", secondary:["Shoulders","Core","Glutes"], equipment:"Kettlebell", type:"weight", cue:"Keep your eyes locked on the bell through every step and never rush a transition." },
{ id:"devils-press", name:"Devil's Press", muscle:"Full Body", secondary:["Shoulders","Quads","Chest"], equipment:"Dumbbell", type:"weight", cue:"Pace yourself early; this burpee and snatch combination spikes your heart rate fast." },
{ id:"burpee", name:"Burpee", muscle:"Full Body", secondary:["Chest","Quads","Core"], equipment:"Bodyweight", type:"bodyweight", cue:"Keep your hips from sagging when your chest hits the floor and stand fully at the top." },
{ id:"man-maker", name:"Man Maker", muscle:"Full Body", secondary:["Back","Shoulders","Quads"], equipment:"Dumbbell", type:"weight", cue:"Widen your feet during the rows so your hips stay square through the whole sequence." },
{ id:"bear-crawl", name:"Bear Crawl", muscle:"Full Body", secondary:["Core","Shoulders","Quads"], equipment:"Bodyweight", type:"time", cue:"Keep your knees an inch off the floor and your hips low with minimal sway." },
// --- Cardio ---
{ id:"treadmill-run", name:"Treadmill Run", muscle:"Cardio", secondary:["Quads","Calves","Hamstrings"], equipment:"Cardio Machine", type:"cardio", cue:"Run near the front of the belt and keep your stride short rather than overreaching." },
{ id:"outdoor-run", name:"Outdoor Run", muscle:"Cardio", secondary:["Quads","Calves","Hamstrings"], equipment:"Other", type:"cardio", cue:"Aim for around one hundred eighty steps per minute to reduce impact on your joints." },
{ id:"sprint-intervals", name:"Sprint Intervals", muscle:"Cardio", secondary:["Hamstrings","Glutes","Quads"], equipment:"Other", type:"cardio", cue:"Warm up thoroughly first; cold hamstrings are the most common cause of sprinting injuries." },
{ id:"treadmill-incline-walk", name:"Treadmill Incline Walk", muscle:"Cardio", secondary:["Glutes","Calves","Hamstrings"], equipment:"Cardio Machine", type:"cardio", cue:"Let go of the handrails; holding on removes most of the work from your legs." },
{ id:"outdoor-walk", name:"Outdoor Walk", muscle:"Cardio", secondary:["Quads","Calves","Glutes"], equipment:"Other", type:"cardio", cue:"Walk briskly enough that holding a conversation is possible but singing is not." },
{ id:"stationary-bike", name:"Stationary Bike", muscle:"Cardio", secondary:["Quads","Hamstrings","Calves"], equipment:"Cardio Machine", type:"cardio", cue:"Set saddle height so your knee stays slightly bent at the bottom of each stroke." },
{ id:"outdoor-cycling", name:"Outdoor Cycling", muscle:"Cardio", secondary:["Quads","Glutes","Calves"], equipment:"Other", type:"cardio", cue:"Spin at a higher cadence in an easier gear instead of grinding heavy gears uphill." },
{ id:"rowing-machine", name:"Rowing Machine", muscle:"Cardio", secondary:["Back","Quads","Glutes"], equipment:"Cardio Machine", type:"cardio", cue:"Drive with your legs first, then lean back, then pull; reverse that order returning." },
{ id:"ski-erg", name:"Ski Erg", muscle:"Cardio", secondary:["Back","Core","Triceps"], equipment:"Cardio Machine", type:"cardio", cue:"Hinge at your hips and finish each pull past your thighs rather than only using arms." },
{ id:"elliptical", name:"Elliptical", muscle:"Cardio", secondary:["Quads","Glutes","Calves"], equipment:"Cardio Machine", type:"cardio", cue:"Keep your weight off the handles and push through your heels to load your legs." },
{ id:"stair-climber", name:"Stair Climber", muscle:"Cardio", secondary:["Glutes","Quads","Calves"], equipment:"Cardio Machine", type:"cardio", cue:"Stand upright and take full steps instead of leaning on the rails and skipping stairs." },
{ id:"assault-bike", name:"Assault Bike", muscle:"Cardio", secondary:["Quads","Back","Shoulders"], equipment:"Cardio Machine", type:"cardio", cue:"Push and pull with your arms as hard as you pedal to spread the effort." },
{ id:"swimming", name:"Swimming", muscle:"Cardio", secondary:["Back","Shoulders","Core"], equipment:"Other", type:"cardio", cue:"Rotate your whole body with each stroke rather than reaching with your shoulder alone." },
{ id:"jump-rope", name:"Jump Rope", muscle:"Cardio", secondary:["Calves","Shoulders"], equipment:"Other", type:"cardio", cue:"Turn the rope with your wrists and hop barely an inch off the floor." },
{ id:"sled-push", name:"Sled Push", muscle:"Cardio", secondary:["Quads","Glutes","Calves"], equipment:"Other", type:"cardio", cue:"Keep your arms locked and your torso in one straight line as you drive with short steps." },
{ id:"sled-drag", name:"Sled Drag", muscle:"Cardio", secondary:["Hamstrings","Glutes","Quads"], equipment:"Other", type:"cardio", cue:"Lean back against the strap and take deliberate steps rather than jogging the weight along." },
{ id:"farmers-walk", name:"Farmer's Walk", muscle:"Cardio", secondary:["Forearms","Traps","Core"], equipment:"Other", type:"cardio", cue:"Heavy in both hands, chest up, controlled steps. The most underrated core builder in any gym and it costs you two minutes." },
{ id:"battle-ropes", name:"Battle Ropes", muscle:"Cardio", secondary:["Shoulders","Core","Back"], equipment:"Other", type:"cardio", cue:"Stay in an athletic stance and generate the waves from your hips, not just your arms." }
];

        var e = e1rm(w, r); if (e > maxE) maxE = e; if (e > dayE) dayE = e;
        if (w > dayW) dayW = w;
        dayV += w * r;
      });
      if (dayV > maxVol) maxVol = dayV;
      if (dayE > 0) hist.push({ date: wo.date, e1rm: dayE, top: dayW, vol: dayV });
    });
  });
  hist.sort(function (a, b) { return a.date < b.date ? -1 : 1; });
  return { maxW: maxW, maxE1rm: maxE, maxReps: maxReps, maxVol: maxVol, hist: hist };
}
/* detect PRs achieved in a finished workout vs everything before it */
function detectPRs(wo) {
  var prs = [];
  var prior = S.workouts.filter(function (w) { return w.id !== wo.id; });
  wo.entries.forEach(function (en) {
    var bw = 0, be = 0;
    prior.forEach(function (w) {
      w.entries.forEach(function (e2) {
        if (e2.exId !== en.exId) return;
        e2.sets.forEach(function (st) {
          if (!st.done || st.warm) return;
          if ((st.w || 0) > bw) bw = st.w || 0;
          var v = e1rm(st.w || 0, st.r || 0); if (v > be) be = v;
        });
      });
    });
    var nw = 0, ne = 0, nr = 0;
    en.sets.forEach(function (st) {
      if (!st.done || st.warm) return;
      if ((st.w || 0) > nw) { nw = st.w || 0; nr = st.r || 0; }
      var v = e1rm(st.w || 0, st.r || 0); if (v > ne) ne = v;
    });
    if (nw > 0 && nw > bw) prs.push({ exId: en.exId, kind: 'weight', val: nw, reps: nr });
    else if (ne > 0 && ne > be * 1.001 && be > 0) prs.push({ exId: en.exId, kind: 'e1rm', val: Math.round(ne) });
  });
  return prs;
}
function muscleVolume(fromKey_, toKey_) {
  var out = {};
  S.workouts.forEach(function (wo) {
    if (wo.date < fromKey_ || wo.date > toKey_) return;
    wo.entries.forEach(function (en) {
      var e = ex(en.exId), v = 0, n = 0;
      en.sets.forEach(function (st) { if (st.done && !st.warm) { v += setVolume(st); n++; } });
      if (!n) return;
      out[e.muscle] = (out[e.muscle] || 0) + n;
    });
  });
  return out;
}

function habitDone(k, id) { return (S.habitLog[k] || []).indexOf(id) >= 0; }
function toggleHabit(k, id) {

  if (i >= 0) S.habitLog[k].splice(i, 1); else S.habitLog[k].push(id);

function habitStreak(id) {
  var k = today(), n = 0;
  if (!habitDone(k, id)) k = addDays(k, -1);
  while (habitDone(k, id)) { n++; k = addDays(k, -1); }

}

/* ======================= SESSION ======================= */
var restT = null;
function startSession(o) {

  S.session = {
    id: uid(), date: today(), name: o.name, planId: o.planId || null, dayIdx: o.dayIdx == null ? null : o.dayIdx,

}

    return { exId: x.exId, sets: sets, targetReps: x.reps, rest: x.rest, note: '' };
  });
  startSession({ name: day.name, planId: p.id, dayIdx: +d.di, entries: entries });
};

function renderSession() {
  var s = S.session, elapsed = (Date.now() - s.startedAt) / 1000;
  var h = '<div class="wrap" style="padding-top:calc(var(--sat) + 4px)">';
  h += '<div class="sesshd"><div class="row between">' +
    '<button class="x" data-act="minimizeSession">' + ic('down') + '</button>' +
    '<div class="center grow"><div class="b" style="font-size:16px;letter-spacing:-.2px">' + esc(s.name) + '</div>' +
    '<div class="xs mut2 tnum" id="sessTime">' + dur(elapsed) + ' · ' + workoutSets(s) + ' sets · ' + Math.round(wOut(workoutVolume(s))).toLocaleString() + ' ' + wU() + '</div></div>' +
    '<button class="btn pri sml" data-act="finishSession">Finish</button></div></div>';

  if (!s.entries.length) {
    h += emptyState('dumbbell', 'Empty workout', 'Add your first exercise to get going.', '<button class="btn pri" data-act="sessAddEx">' + ic('plus') + 'Add exercise</button>');
  }
  s.entries.forEach(function (en, ei) {
    var e = ex(en.exId), last = lastSetsFor(en.exId);
    h += '<div class="exblk"><div class="eh"><div class="grow" data-act="openEx" data-id="' + en.exId + '">' +
      '<div class="nm">' + esc(e.name) + '</div>' +
      '<div class="mt">' + esc(e.muscle) + (en.targetReps ? ' · target ' + esc(en.targetReps) + ' reps' : '') + ' · rest ' + mmss(en.rest || S.settings.restDefault) + '</div></div>' +
      '<button class="x" data-act="exMenu" data-ei="' + ei + '">' + ic('more') + '</button></div>';

    var cols = colsFor(e);
    h += '<div class="setrow hd"><div class="n">Set</div><div>' + cols[0] + '</div><div>' + (cols[1] || '') + '</div><div></div></div>';
    en.sets.forEach(function (st, si) {
      h += setRowHtml(e, en, st, ei, si, last);
    });
    h += '<div class="exfoot"><button class="btn sml grow" data-act="addSet" data-ei="' + ei + '">' + ic('plus') + 'Set</button>' +
      '<button class="btn sml" data-act="delSet" data-ei="' + ei + '">Remove set</button></div></div>';
  });

  if (s.entries.length) h += '<button class="btn blk" data-act="sessAddEx" style="margin-top:4px">' + ic('plus') + 'Add exercise</button>';
  h += '<div class="fld" style="margin-top:14px"><label>Session notes</label><textarea id="sessNote" rows="2" placeholder="How did it feel?">' + esc(s.notes) + '</textarea></div>';
  h += '<button class="btn blk dan" data-act="discardSession" style="margin-top:6px">Discard workout</button>';
  h += '<div style="height:80px"></div></div>';

}
function colsFor(e) {
  if (e.type === 'cardio') return ['Time (min)', isKg() ? 'Dist (km)' : 'Dist (mi)'];
  if (e.type === 'time') return ['Time (sec)', ''];
  if (e.type === 'bodyweight') return ['Reps', ''];
  if (e.type === 'weighted-bodyweight') return ['+' + wU(), 'Reps'];
  return [wU(), 'Reps'];
}
function setRowHtml(e, en, st, ei, si, last) {
  var prev = last && last.sets[si] ? last.sets[si] : null;
  function cell(f, val, ph, prevTxt, mode) {
    return '<div><input type="number" inputmode="' + (mode || 'decimal') + '" data-f="' + f + '" data-ei="' + ei + '" data-si="' + si + '" value="' + (val == null ? '' : val) + '" placeholder="' + ph + '">' +
      (prevTxt ? '<div class="prev">' + prevTxt + '</div>' : '') + '</div>';
  }
  var c1 = '', c2 = '<div></div>';
  if (e.type === 'cardio') {
    c1 = cell('t', st.t == null ? '' : r1(st.t / 60), '0', prev ? r1(prev.t / 60) + ' min' : '');
    c2 = cell('d', st.d, '0', prev && prev.d ? r1(prev.d) + (isKg() ? ' km' : ' mi') : '');
  } else if (e.type === 'time') {
    c1 = cell('t', st.t, '0', prev ? prev.t + ' s' : '', 'numeric');
  } else if (e.type === 'bodyweight') {
    c1 = cell('r', st.r, '0', prev ? prev.r + ' reps' : '', 'numeric');
  } else {
    c1 = cell('w', st.w == null ? '' : wOut(st.w), '0', prev && prev.w ? wOut(prev.w) + ' ' + wU() : '');
    c2 = cell('r', st.r, '0', prev ? prev.r + ' reps' : '', 'numeric');
  }
  return '<div class="setrow' + (st.done ? ' done' : '') + (st.warm ? ' warm' : '') + '" data-row="' + ei + '-' + si + '">' +
    '<div class="n" data-act="toggleWarm" data-ei="' + ei + '" data-si="' + si + '">' + (st.warm ? 'W' : (si + 1)) + '</div>' +
    c1 + c2 +
    '<button class="ck" data-act="setDone" data-ei="' + ei + '" data-si="' + si + '">' + ic('check') + '</button></div>';
}

/* live input binding — avoids re-render so focus is never lost */
document.addEventListener('input', function (e) {
  var t = e.target;
  if (t.id === 'sessNote' && S.session) { S.session.notes = t.value; save(); return; }
  if (t.id === 'libq') { libState.q = t.value; renderLibListOnly(); return; }
  if (!t.dataset || !t.dataset.f || !S.session) return;
  var en = S.session.entries[+t.dataset.ei]; if (!en) return;
  var st = en.sets[+t.dataset.si]; if (!st) return;
  var f = t.dataset.f, v = t.value === '' ? null : num(t.value);
  var e2 = ex(en.exId);
  if (f === 'w') st.w = v == null ? null : wIn(v);
  else if (f === 'r') st.r = v == null ? null : Math.round(v);
  else if (f === 't') st.t = v == null ? null : (e2.type === 'cardio' ? v * 60 : Math.round(v));
  else if (f === 'd') st.d = v;
  save();
  updateSessHead();
});
var _libT = null;
function renderLibListOnly() { clearTimeout(_libT); _libT = setTimeout(function () { var v = $('#libq') ? $('#libq').value : ''; render(); var i = $('#libq'); if (i) { i.focus(); i.value = v; i.setSelectionRange(v.length, v.length); } }, 220); }

function updateSessHead() {
  var s = S.session; if (!s) return;
  var el = $('#sessTime'); if (!el) return;
  el.textContent = dur((Date.now() - s.startedAt) / 1000) + ' · ' + workoutSets(s) + ' sets · ' + Math.round(wOut(workoutVolume(s))).toLocaleString() + ' ' + wU();
}
setInterval(function () { if (S.session) updateSessHead(); }, 20000);

ACT.setDone = function (d) {
  var en = S.session.entries[+d.ei], st = en.sets[+d.si], e = ex(en.exId);
  if (!st.done) {
    // auto-fill from previous set or last session if blank
    if (e.type === 'weight' || e.type === 'weighted-bodyweight') {
      if (st.w == null || st.r == null) {
        var src = en.sets[+d.si - 1];
        var last = lastSetsFor(en.exId);
        var lp = last && last.sets[+d.si];
        if (st.w == null) st.w = src && src.w != null ? src.w : (lp ? lp.w : null);
        if (st.r == null) st.r = src && src.r != null ? src.r : (lp ? lp.r : null);
      }
      if (st.r == null && e.type === 'weight') st.r = 0;
    } else if (e.type === 'bodyweight' && st.r == null) {
      var src2 = en.sets[+d.si - 1], last2 = lastSetsFor(en.exId);
      st.r = src2 && src2.r != null ? src2.r : (last2 && last2.sets[+d.si] ? last2.sets[+d.si].r : 0);
    }
  }
  st.done = !st.done;
  save(); buzz(st.done ? 14 : 8);
  var row = $('[data-row="' + d.ei + '-' + d.si + '"]');
  if (row) {
    row.classList.toggle('done', st.done);
    var inputs = $$('input', row);
    if (st.done) {
      if (e.type === 'weight' || e.type === 'weighted-bodyweight') { if (inputs[0] && st.w != null) inputs[0].value = wOut(st.w); if (inputs[1] && st.r != null) inputs[1].value = st.r; }
      else if (e.type === 'bodyweight') { if (inputs[0] && st.r != null) inputs[0].value = st.r; }
      inputs.forEach(function (i) { i.blur(); });
    }
  }
  updateSessHead();
  if (st.done && !st.warm) startRest(en.rest || S.settings.restDefault);
};

/* ---------- rest timer ---------- */
function startRest(sec) {
  if (!sec) return;
  S.session.restEnd = Date.now() + sec * 1000;
  S.session.restLen = sec; save();
  drawRest();
  if (restT) clearInterval(restT);
  restT = setInterval(drawRest, 250);
}
function stopRest() {
  if (restT) { clearInterval(restT); restT = null; }
  if (S.session) { S.session.restEnd = null; save(); }
  var h = $('#restHost'); if (h) h.innerHTML = '';
}
function drawRest() {
  var host = $('#restHost'); if (!host || !S.session || !S.session.restEnd) { if (host) host.innerHTML = ''; return; }
  var left = (S.session.restEnd - Date.now()) / 1000;
  if (left <= 0) {
    host.innerHTML = '';
    if (restT) { clearInterval(restT); restT = null; }
    S.session.restEnd = null; save();
    beep(2); buzz([90, 60, 90]);
    return;
  }
  var pct = 1 - left / S.session.restLen;
  host.innerHTML = '<div class="timerbar"><div class="prg" style="width:' + r1(pct * 100) + '%"></div>' +
    ic('clock') + '<div class="t tnum">' + mmss(left) + '</div><div class="grow lbl">rest</div>' +
    '<button class="btn sml" style="background:rgba(0,0,0,.18);border-color:transparent;color:#160800" data-act="restAdd" data-v="30">+30s</button>' +
    '<button class="btn sml" style="background:rgba(0,0,0,.18);border-color:transparent;color:#160800" data-act="restSkip">Skip</button></div>';
}
ACT.restAdd = function (d) { if (S.session && S.session.restEnd) { S.session.restEnd += (+d.v) * 1000; S.session.restLen += (+d.v); save(); drawRest(); } };
ACT.restSkip = function () { stopRest(); };

/* ---------- finish ---------- */
ACT.finishSession = function () {
  var s = S.session;
  var logged = workoutSets(s);
  if (!logged) {
    confirmSheet('Nothing logged', 'No sets are checked off. Discard this workout?', 'Discard', function () {
      S.session = null; stopRest(); save(); go('train');
    }, true);
    return;
  }
  var wo = {
    id: s.id, date: s.date, name: s.name, planId: s.planId, dayIdx: s.dayIdx,
    startedAt: s.startedAt, endedAt: Date.now(), duration: (Date.now() - s.startedAt) / 1000,
    notes: s.notes, prs: [],
    entries: s.entries.map(function (en) {
      return { exId: en.exId, note: en.note || '', sets: en.sets.filter(function (x) { return x.done; }).map(function (x) { return { w: x.w, r: x.r, t: x.t, d: x.d, done: true, warm: !!x.warm }; }) };
    }).filter(function (en) { return en.sets.length; })
  };
  S.workouts.push(wo);
  wo.prs = detectPRs(wo);
  // advance program day
  if (s.planId != null && s.dayIdx != null) {
    var p = planById(s.planId);
    if (p && S.activePlanId === p.id) S.activeDayIdx = (s.dayIdx + 1) % p.days.length;
  }
  S.session = null; stopRest(); saveNow(); autoSync(1500);
  go('train');
  setTimeout(function () { workoutSummary(wo, true); }, 120);
};

function workoutSummary(wo, fresh) {
  var body = '';
  if (fresh) body += '<div class="center" style="margin-bottom:16px"><div class="bigico" style="color:var(--acc)">' + ic('trophy') + '</div><div class="b" style="font-size:18px;margin-top:12px">Nice work</div></div>';
  body += '<div class="g3" style="margin-bottom:14px">' +
    '<div class="stat"><div class="k">Time</div><div class="v">' + dur(wo.duration) + '</div></div>' +
    '<div class="stat"><div class="k">Sets</div><div class="v">' + workoutSets(wo) + '</div></div>' +
    '<div class="stat"><div class="k">Volume</div><div class="v">' + Math.round(wOut(workoutVolume(wo)) / 100) / 10 + 'k</div><div class="d mut2">' + wU() + '</div></div></div>';
  if (wo.prs && wo.prs.length) {
    body += '<h2 class="sec">Personal records</h2><div class="list">';
    wo.prs.forEach(function (p) {
      body += '<div class="li"><div class="ico" style="color:var(--acc)">' + ic('trophy') + '</div><div class="grow"><div class="b sm">' + esc(ex(p.exId).name) + '</div>' +
        '<div class="xs mut2">' + (p.kind === 'weight' ? 'New top set: ' + wOut(p.val) + ' ' + wU() + ' × ' + p.reps : 'New estimated 1RM: ' + Math.round(wOut(p.val)) + ' ' + wU()) + '</div></div>' +
        '<span class="tag pr">PR</span></div>';
    });
    body += '</div>';
  }
  wo.entries.forEach(function (en) {
    var e = ex(en.exId);
    body += '<h2 class="sec">' + esc(e.name) + '</h2><div class="list">';
    en.sets.forEach(function (st, i) {
      body += '<div class="li"><div class="grow sm ' + (st.warm ? 'mut2' : '') + '">' + (st.warm ? 'Warm-up' : 'Set ' + (i + 1)) + '</div><div class="b tnum sm">' + setLabel(e, st) + '</div></div>';
    });
    body += '</div>';
  });
  if (wo.notes) body += '<h2 class="sec">Notes</h2><div class="card sm">' + esc(wo.notes) + '</div>';
  if (!fresh) body += '<div class="spacer"></div><button class="btn blk dan" data-act="delWorkout" data-id="' + wo.id + '">Delete this workout</button>';
  sheet({ title: wo.name + ' · ' + niceDate(wo.date), body: body });
}

function prBoard() {
  var byEx = {};
  S.workouts.forEach(function (wo) {
    wo.entries.forEach(function (en) {
      var e = ex(en.exId);
      if (e.type === 'cardio' || e.type === 'time') return;
      var rec = byEx[en.exId] = byEx[en.exId] || { exId: en.exId, maxW: 0, e1rm: 0, sessions: 0, last: wo.date };
      var any = false;
      en.sets.forEach(function (st) {
        if (!st.done || st.warm) return;
        any = true;
        if ((st.w || 0) > rec.maxW) rec.maxW = st.w || 0;
        var v = e1rm(st.w || 0, st.r || 0); if (v > rec.e1rm) rec.e1rm = v;
      });
      if (any) { rec.sessions++; if (wo.date > rec.last) rec.last = wo.date; }
    });
  });
  return Object.keys(byEx).map(function (k) { return byEx[k]; })
    .filter(function (r) { return r.maxW > 0; })
    .sort(function (a, b) { return b.e1rm - a.e1rm; });
}

    out.push({ v: v, l: (fromKey(end).getMonth() + 1) + '/' + fromKey(end).getDate() });

}

/* ---------- GitHub gist transport ---------- */
var DATA_FILE = 'forge-data.json';
var IN_FILE = 'health-inbox.json';
var OUT_FILE = 'health-outbox.json';

function gh(path, method, body) {
  var o = {
    method: method || 'GET',
    headers: {
      'Authorization': 'Bearer ' + (S.sync.token || ''),
      'Accept': 'application/vnd.github+json',
      'X-GitHub-Api-Version': '2022-11-28'

  return fetch('https://api.github.com' + path, o).then(function (res) {
    if (res.status === 401) throw new Error('AUTH');
    if (res.status === 404) throw new Error('NOTFOUND');
    if (res.status === 403) throw new Error('FORBIDDEN');
    if (!res.ok) return res.text().then(function (t) { throw new Error('HTTP ' + res.status + ' ' + t.slice(0, 100)); });

}

    public: false,
    files: (function () {

      f[DATA_FILE] = { content: JSON.stringify(snapshot(S)) };
      f[OUT_FILE] = { content: JSON.stringify(buildOutbox()) };
      f[IN_FILE] = { content: JSON.stringify({ days: [] }) };
      f['README.md'] = {
        content: '# Forge data\n\nThis private gist is the sync store for the Forge app.\n\n' +
          '- `' + DATA_FILE + '` — your workouts, food log, weights and settings.\n' +
          '- `' + OUT_FILE + '` — written by Forge, read by the Apple Health Shortcut.\n' +
          '- `' + IN_FILE + '` — written by the Shortcut, read by Forge.\n\n' +
          'Every save is a revision, so the History tab is a full backup timeline.\n'
